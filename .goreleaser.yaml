# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: focal

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: focal
    main: ./cmd/focal
    binary: focal
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/youyo/focal/internal/cli.version={{ .Version }}

archives:
  - id: default
    builds:
      - focal
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{incpatch .Version}}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: focal
    repository:
      owner: youyo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/youyo/focal"
    description: "Give coding agents visibility, not shell access — restricted SSH inspection CLI + remote MCP"
    license: "MIT"
    install: |
      bin.install "focal"
    test: |
      system "#{bin}/focal", "--version"

release:
  github:
    owner: youyo
    name: focal
  prerelease: auto
