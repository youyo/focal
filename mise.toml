[tools]
go = "1.26"
golangci-lint = "2.13.1"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-race]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.e2e]
description = "Run the end-to-end suite against a real sshd container (requires docker + docker compose)"
run = "go test -tags=e2e -count=1 ./test/e2e/..."
